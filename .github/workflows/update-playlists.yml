name: Update playlists

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test playlist generation
        run: python -m unittest discover -s tests

      - name: Generate Farsi playlists
        run: python iptv_builder.py --lang fas --output playlist.m3u

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u playlist_hd.m3u playlist_sd.m3u
          if git diff --staged --quiet; then
            echo "No playlist changes"
          else
            git commit -m "chore: refresh Farsi playlists"
            git push
          fi
