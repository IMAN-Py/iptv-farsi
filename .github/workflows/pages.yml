name: Publish picker

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'index.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  workflow_run:
    workflows: [Update playlists]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Build compact static picker
        run: python3 website/build_catalog.py index.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
