<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="title desc">
  <title id="title">Open TV Atlas — live TV, in your language</title>
  <desc id="desc">Worldwide television playlists organized by language and category.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1224"/><stop offset="1" stop-color="#133c42"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#a7f3d0"/></linearGradient>
  </defs>
  <rect width="1280" height="380" rx="24" fill="url(#bg)"/>
  <circle cx="1130" cy="190" r="245" fill="none" stroke="#5eead4" stroke-opacity=".09" stroke-width="60"/>
  <circle cx="1130" cy="190" r="150" fill="none" stroke="#5eead4" stroke-opacity=".1" stroke-width="2"/>
